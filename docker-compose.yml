version: '3.9'
services:

  auth-postgres:
    image: postgres:13
    container_name: auth-postgres
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_HOST=localhost
      - POSTGRES_PASSWORD=auth
      - POSTGRES_DB=auth
      - POSTGRES_USER=auth
    volumes:
      - auth-postgres:/var/lib/postgresql/data

volumes:
  auth-postgres:
    name: auth-postgres-db
